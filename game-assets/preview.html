<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lingora Asset Önizleme</title>
<style>
  body { margin: 0; padding: 16px; background: #fff; font: 13px/1.3 system-ui, sans-serif; color: #2B2D42; }
  h2 { margin: 16px 0 8px; font-size: 15px; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  figure { margin: 0; width: 200px; }
  figure.wide { width: 410px; }
  .tile { display: flex; gap: 2px; height: 200px; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0/16px 16px; border: 1px solid #ddd; }
  .tile svg { height: 100%; aspect-ratio: 1; display: block; }
  figcaption { font-size: 11px; margin-top: 3px; }
  figcaption b { font-weight: 600; }
  #legend { margin-bottom: 8px; gap: 8px; }
  #legend figure { width: 64px; text-align: center; }
  #legend .tile { height: 56px; }
</style>
</head>
<body>
<div id="legend" class="grid"></div>
<div id="out"></div>
<script>
// Kullanım:
//   preview.html?mode=assets[&cat=character|object|background|overlay|face]
//   preview.html?level=A1|A2|B1[&n=12][&ids=id1,id2][&sent=0|form=past][&filter=metin]
const q = new URLSearchParams(location.search);
const SVGNS = "http://www.w3.org/2000/svg";
const cache = {};
let M, BY, LAY;

async function load(file) {
  if (!cache[file]) cache[file] = fetch(file).then(r => r.text()).then(t =>
    new DOMParser().parseFromString(t, "image/svg+xml").documentElement.querySelector("g"));
  return (await cache[file]).cloneNode(true);
}
const g = (attrs = {}) => { const e = document.createElementNS(SVGNS, "g"); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const place = (el, x, y, s) => { el.setAttribute("transform", `translate(${x} ${y}) scale(${s})`); return el; };
const pt = (str) => str ? str.split(",").map(Number) : null;
function svg(children) {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", "0 0 256 256");
  children.filter(Boolean).forEach(c => s.appendChild(c));
  return s;
}

// Aktör = karakter + elindeki nesne(ler) + yüz ifadesi + duygu işareti, karakter koordinatlarında
async function buildActor(a, denied) {
  const root = g();
  const ch = await load(BY[a.char].file);
  root.appendChild(ch);
  if (a.hold) {
    const [ax, ay] = a.hold.anchor || [176, 160], s = a.hold.s || 0.3, n = a.hold.n || 1;
    for (let i = 0; i < n; i++) {
      const o = await load(BY[a.hold.obj].file);
      if (a.hold.tint) o.querySelectorAll('[data-tint="primary"]').forEach(e => e.setAttribute("fill", a.hold.tint));
      root.appendChild(place(o, ax - 128 * s + (i - (n - 1) / 2) * 256 * s * 0.3, ay - 230 * s, s));  // v3: avuçta toplu
    }
  }
  if (a.expr) {
    const emo = M.emotions.find(e => e.id === a.expr);
    const eyes = ch.querySelector('[data-part="eyes"]'), mouth = ch.querySelector('[data-part="mouth"]');
    const swap = async (partEl, faceId, dy = 0, hide = true) => {
      if (!partEl || !faceId) return;
      const cx = +partEl.getAttribute("data-cx"), cy = +partEl.getAttribute("data-cy");
      if (hide) partEl.setAttribute("display", "none");
      root.appendChild(place(await load(BY[faceId].file), cx - 128, cy - 128 + dy, 1));
    };
    await swap(mouth, emo.mouth);
    await swap(eyes, emo.eyes);
    await swap(eyes, emo.brows, 0, false);
    if (emo.mark) {
      const [hx, hy] = pt(ch.getAttribute("data-head")) || [128, 40], L = LAY.mark;
      root.appendChild(place(await load(BY[emo.mark].file), hx + L.dx - 128 * L.s, hy + L.dy - 128 * L.s, L.s));
    }
  }
  if (a.marker && BY[a.marker]) {
    // v5 §4 işaret kuralı: önce başın üstü (data-head + (0, dy)); işaretin tuvaldeki üst kenarı < 4 ise
    // başın yanı (data-head + (52, 24)). (Aynı kural SvgScene'de.)
    const [hx, hy] = pt(ch.getAttribute("data-head")) || [128, 40], L = LAY.marker || { dy: -34, s: 0.22 };
    const topCanvas = 230 - 230 * a.s + (hy + L.dy - 60 * L.s) * a.s;
    const [mx, my] = topCanvas < 4 ? [hx + 52, hy + 24] : [hx, hy + L.dy];
    root.appendChild(place(await load(BY[a.marker].file), mx - 128 * L.s, my - 128 * L.s, L.s));
  }
  if (denied && BY.badge_not) {
    // v5 §1: badge_not varsa inkâr edilen şeyin üstüne çarpı: elde nesne varsa tutma noktası, yoksa göğüs (head + (0, 70)).
    const [hx, hy] = pt(ch.getAttribute("data-head")) || [128, 40];
    const [cx, cy] = a.hold && a.hold.anchor ? a.hold.anchor : [hx, hy + 70], ls = 0.12 / a.s;
    root.appendChild(place(await load(BY.badge_not.file), cx - 128 * ls, cy - 128 * ls, ls));
  }
  return place(root, a.x - 128 * a.s, 230 - 230 * a.s, a.s);
}

async function buildPanel(r, sentence) {
  const parts = [];
  if (r.bg) {
    const bg = await load(BY[r.bg].file);
    if (r.sky) bg.querySelectorAll('[data-tint="sky"]').forEach(e => e.setAttribute("fill", r.sky));
    parts.push(bg);
  }
  if (r.sky_overlay) { const L = LAY.sky_overlay; parts.push(place(await load(BY[r.sky_overlay].file), L.x, L.y, L.s)); }
  if (r.show) {  // v6 this/that: show_near (yakın, büyük) / show_far (uzakta, küçük); nesne tek başına
    const L = LAY[r.layout].obj, n = r.show.n || 1;
    for (let i = 0; i < n; i++) {
      const o = await load(BY[r.show.obj].file);
      if (r.show.tint) o.querySelectorAll('[data-tint="primary"]').forEach(e => e.setAttribute("fill", r.show.tint));
      parts.push(place(o, L.x - 128 * L.s + (i - (n - 1) / 2) * 256 * L.s * 0.7, L.y - 230 * L.s, L.s));
    }
  }
  if (r.prop) {
    const L = LAY.prop.prop, ps = r.prop.s || L.s, p = await load(BY[r.prop.obj].file);
    if (r.prop.states) p.dataset.states = r.prop.states.join(",");
    parts.push(place(p, L.x - 128 * ps, 230 - 230 * ps, ps));
  }
  if (r.weather) {  // v3: hava aktörlerin arkasında (yağmur/kar yüzü örtmesin)
    const w = M.weather.find(x => x.id === r.weather);
    const el = await load(BY[w.overlay].file);
    parts.push(w.kind === "adj" && w.overlay === "sun" ? place(el, 190, 2, 0.25) : el);
  }
  const denied = !!(sentence && (sentence.badges || []).includes("badge_not"));
  for (const [i, a] of (r.actors || []).entries()) parts.push(await buildActor(a, denied && i === 0));
  if (r.bubble) {
    const L = (LAY[r.layout] || LAY.bubble).bubble;
    parts.push(place(await load(BY[r.bubble.type + "_bubble"].file), L.x, L.y, L.s));
    if (r.bubble.content) {
      const C = LAY.bubble.content, id = r.bubble.content.char || r.bubble.content.obj;
      parts.push(place(await load(BY[id].file), C.x - 128 * C.s, C.y - 150 * C.s, C.s));
    }
  }
  for (const [i, b] of ((sentence && sentence.badges) || []).entries()) {  // v3: sol üstte dikey yığın
    const L = LAY.badge; parts.push(place(await load(BY[b].file), L.x + i * (L.dx || 0), L.y + i * (L.dy || 0), L.s));
  }
  return svg(parts);
}

function tile(svgs, caption, wide) {
  const f = document.createElement("figure");
  if (wide) f.className = "wide";
  const t = document.createElement("div"); t.className = "tile";
  svgs.forEach(s => t.appendChild(s));
  const c = document.createElement("figcaption"); c.innerHTML = caption;
  f.append(t, c); return f;
}
const esc = s => s.replace(/[&<>]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));

// Animasyon: data-frame grupları ve durum (data-state) geçişleri döngüde
let tick = 0;
setInterval(() => {
  tick++;
  document.querySelectorAll("svg").forEach(s => {
    s.querySelectorAll("g").forEach(el => {
      const frames = el.querySelectorAll(":scope > [data-frame]");
      if (frames.length) frames.forEach(f => f.setAttribute("display", (+f.dataset.frame - 1) === tick % frames.length ? "inline" : "none"));
    });
    s.querySelectorAll("[data-states]").forEach(el => {
      const st = el.dataset.states.split(","), cur = st[Math.floor(tick / 3) % st.length];
      el.querySelectorAll(":scope > [data-state]").forEach(x => x.setAttribute("display", x.dataset.state === cur ? "inline" : "none"));
    });
    s.querySelectorAll("g").forEach(el => {  // durum listesi verilmemiş durumlu nesne: ilk durumu göster
      const sts = el.querySelectorAll(":scope > [data-state]");
      if (sts.length && !el.dataset.states) sts.forEach((x, i) => x.setAttribute("display", i === 0 ? "inline" : "none"));
    });
  });
}, 300);

(async () => {
  M = await fetch("manifest.json").then(r => r.json());
  BY = Object.fromEntries(M.assets.map(a => [a.id, a]));
  LAY = M.layouts;
  const out = document.getElementById("out");
  // v5 §1: rozet / işaret açıklaması (Türkçe etiketler)
  const LEGEND = [["cal_yesterday", "dün"], ["cal_tomorrow", "yarın"], ["badge_not", "değil"], ["badge_question", "soru"],
                  ["cal_everyday", "her gün"], ["badge_can", "-ebilir"], ["marker_me", "ben"], ["marker_you", "sen"],
                  ["mark_exclaim", "emir"]];
  for (const [id, label] of LEGEND) {
    if (BY[id]) document.getElementById("legend").appendChild(tile([svg([await load(BY[id].file)])], esc(label)));
  }
  if (q.get("mode") === "assets") {
    const cat = q.get("cat");
    for (const c of ["character", "object", "background", "overlay", "face"]) {
      if (cat && cat !== c) continue;
      out.insertAdjacentHTML("beforeend", `<h2>${c}</h2>`);
      const grid = document.createElement("div"); grid.className = "grid"; out.appendChild(grid);
      for (const a of M.assets.filter(a => a.category === c)) {
        try { grid.appendChild(tile([svg([await load(a.file)])], a.id)); }
        catch { grid.appendChild(tile([svg([])], a.id + " (yok)")); }
      }
    }
  } else {
    const level = q.get("level") || "A1";
    let rows = (await fetch(`scenes/${level}.jsonl`).then(r => r.text())).trim().split("\n").map(JSON.parse);
    if (q.get("ids")) { const want = q.get("ids").split(","); rows = rows.filter(r => want.includes(r.id)); }
    if (q.get("filter")) rows = rows.filter(r => r.id.includes(q.get("filter")));
    const n = +(q.get("n") || 12), step = Math.max(1, Math.floor(rows.length / n));
    const grid = document.createElement("div"); grid.className = "grid"; out.appendChild(grid);
    for (let i = 0; i < rows.length && grid.childElementCount < n; i += step) {
      const r = rows[i];
      const s = q.get("form") ? (r.sentences.find(x => x.form === q.get("form")) || r.sentences[0])
                              : r.sentences[Math.min(+(q.get("sent") || 0), r.sentences.length - 1)];
      const svgs = r.layout === "panels"
        ? await Promise.all(r.panels.map(p => buildPanel({ ...p, bg: r.bg }, null)))
        : [await buildPanel(r, s)];
      const ans = s.answer ? `<br><i>→ ${esc(s.answer.en)} / ${esc(s.answer.tr)}</i>` : "";   // v6 wh cevabı
      grid.appendChild(tile(svgs, `<b>${esc(s.en)}</b><br>${esc(s.tr)}${ans}`, r.layout === "panels"));
    }
  }
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
